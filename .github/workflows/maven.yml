name: Java CI with Maven

on:
  push:
    branches: [ "master", "backend_dev" ]
  pull_request:
    branches: [ "master", "backend_dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/marsapp

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run tests
      run: |
        chmod +x mvnw
        ./mvnw clean test
